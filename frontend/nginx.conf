server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: cualquier ruta desconocida la resuelve el router de Vue.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los assets llevan hash en el nombre: se pueden cachear indefinidamente.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html nunca se cachea: es quien apunta a los assets nuevos tras un deploy.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
