# =============================================================================
# nginx del contenedor `web` (infra/docker/docker-compose.prod.yml).
#
# Es la única puerta de entrada del stack: sirve la SPA, reenvía /api al
# backend y /vet-docs/ a MinIO. Ni el backend ni MinIO publican puertos.
#
# TLS: este contenedor habla HTTP. En producción va detrás de un nginx (o
# Caddy) del host que termina TLS — ver docs/operations/despliegue.md —. La
# cabecera HSTS solo se emite cuando ese proxy avisa que la petición llegó por
# HTTPS (X-Forwarded-Proto).
#
# Cabeceras de seguridad: en nginx, un `add_header` dentro de un `location`
# anula TODOS los del server. Por eso los location de la SPA no usan
# add_header (la caché se fija con `expires`) y heredan los del server; /api y
# /vet-docs declaran explícitamente los suyos.
# =============================================================================

map $http_x_forwarded_proto $veterp_hsts {
  https   "max-age=31536000; includeSubDomains";
  default "";
}

# X-Forwarded-Proto: si ya viene del proxy TLS del host, se conserva; si no,
# es el esquema de esta conexión.
map $http_x_forwarded_proto $veterp_proto {
  ""      $scheme;
  default $http_x_forwarded_proto;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Formularios JSON: 1 MB. Los archivos tienen su propio límite en /api/archivos.
  client_max_body_size 1m;

  # ---- Cabeceras de seguridad (heredadas por los location de la SPA) --------
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Strict-Transport-Security $veterp_hsts always;
  # La SPA carga sus tipografías de Google y habla con su propio origen: /api
  # y /vet-docs (radiografías, PDFs) están en el mismo dominio.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

  # ---- API ------------------------------------------------------------------
  location /api/ {
    proxy_pass         http://api:3100;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $veterp_proto;
    proxy_read_timeout 120s;
    # El backend pone sus propias cabeceras (helmet); aquí solo HSTS, que
    # depende de cómo llegó la petición.
    add_header Strict-Transport-Security $veterp_hsts always;
  }

  # Subida de archivos clínicos: el único sitio donde se aceptan 50 MB.
  location = /api/archivos {
    client_max_body_size 50m;
    proxy_pass         http://api:3100;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $veterp_proto;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    add_header Strict-Transport-Security $veterp_hsts always;
  }

  # ---- Archivos clínicos (MinIO) --------------------------------------------
  # Las URLs firmadas que entrega el backend apuntan a https://<dominio>/vet-docs/…
  # (STORAGE_PUBLIC_ENDPOINT). El Host se reenvía tal cual porque es parte de
  # la firma; la ruta y la query, también sin tocar.
  location ^~ /vet-docs {
    client_max_body_size 50m;
    proxy_pass         http://minio:9000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $http_host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $veterp_proto;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    # El tipo de cada objeto lo fija el backend contra una lista blanca (y en la
    # subida directa, la política firmada): nosniff impide que el navegador
    # "adivine" otro. Sin CSP `sandbox`: Chrome se niega a mostrar un PDF bajo
    # sandbox, y los consentimientos escaneados son PDFs.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security $veterp_hsts always;
  }

  # ---- SPA ------------------------------------------------------------------
  # Cualquier ruta desconocida la resuelve el router de Vue.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los assets llevan hash en el nombre: se pueden cachear indefinidamente.
  # `expires` en vez de add_header, para no perder las cabeceras del server.
  location /assets/ {
    expires 1y;
  }

  # index.html nunca se cachea: es quien apunta a los assets nuevos tras un deploy.
  location = /index.html {
    expires -1;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
