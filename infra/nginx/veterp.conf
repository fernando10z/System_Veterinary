# =============================================================================
# nginx de producción — sirve el frontend y hace de reverse proxy del backend.
#
# Instalación:
#   sudo cp infra/nginx/veterp.conf /etc/nginx/sites-available/veterp
#   sudo ln -s /etc/nginx/sites-available/veterp /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: emitir con certbot --nginx -d vet.tudominio.com
# =============================================================================

server {
  listen 80;
  server_name vet.tudominio.com;

  # Redirección a HTTPS (deja esta línea comentada hasta emitir el certificado)
  # return 301 https://$host$request_uri;

  root /var/www/veterp;
  index index.html;

  client_max_body_size 50M;   # radiografías y resultados de laboratorio

  # ---- API ----
  location /api/ {
    proxy_pass         http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # ---- SPA ----
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header Referrer-Policy no-referrer-when-downgrade;
}
