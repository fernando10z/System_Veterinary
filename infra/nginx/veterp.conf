# =============================================================================
# nginx de producción (Opción B: PM2 + nginx en el host). Sirve el frontend,
# hace de reverse proxy del backend y de MinIO, y termina TLS.
#
# Instalación (ver docs/operations/despliegue.md):
#   sudo cp infra/nginx/snippets/veterp-security-headers.conf /etc/nginx/snippets/
#   sudo cp infra/nginx/veterp.conf /etc/nginx/sites-available/veterp
#   sudo sed -i 's/vet.tudominio.com/<tu dominio>/g' /etc/nginx/sites-available/veterp
#   sudo ln -s /etc/nginx/sites-available/veterp /etc/nginx/sites-enabled/
#
# Certificado (Let's Encrypt, modo webroot: no reescribe este archivo):
#   sudo mkdir -p /var/www/certbot
#   sudo certbot certonly --webroot -w /var/www/certbot -d vet.tudominio.com
#   sudo nginx -t && sudo systemctl reload nginx
# La renovación la hace el timer de certbot; tras renovar, recargar nginx:
#   /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh → systemctl reload nginx
#
# Primer arranque sin certificado todavía: comentar el server de 443, dejar el
# de 80 sin el `return 301`, emitir el certificado y restaurar.
#
# Backend en 127.0.0.1:3100 (TRUST_PROXY=1). MinIO en 127.0.0.1:9000, con
# STORAGE_PUBLIC_ENDPOINT=https://vet.tudominio.com en el backend.
# =============================================================================

# ---- HTTP: solo el desafío de Let's Encrypt y la redirección ----------------
server {
  listen 80;
  listen [::]:80;
  server_name vet.tudominio.com;
  server_tokens off;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ---- HTTPS -----------------------------------------------------------------
server {
  # `listen … http2` (y no la directiva `http2 on`) funciona también con el
  # nginx 1.24 de Ubuntu 24.04.
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name vet.tudominio.com;
  server_tokens off;

  ssl_certificate     /etc/letsencrypt/live/vet.tudominio.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/vet.tudominio.com/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:VETERP_SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  # Sin OCSP stapling: Let's Encrypt dejó de ofrecer OCSP en 2025.

  root /var/www/veterp;
  index index.html;

  # Formularios JSON: 1 MB. Los archivos tienen su propio límite más abajo.
  client_max_body_size 1m;

  include /etc/nginx/snippets/veterp-security-headers.conf;

  # ---- API ----
  location /api/ {
    proxy_pass         http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Subida de archivos clínicos: el único sitio con 50 MB.
  location = /api/archivos {
    client_max_body_size 50m;
    proxy_pass         http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }

  # ---- Archivos clínicos (MinIO) ----
  # Las URLs firmadas apuntan a https://vet.tudominio.com/vet-docs/…; el Host
  # es parte de la firma y se reenvía tal cual.
  location ^~ /vet-docs {
    client_max_body_size 50m;
    proxy_pass         http://127.0.0.1:9000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $http_host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    # Solo nosniff y HSTS: sin CSP `sandbox`, porque Chrome se niega a mostrar
    # un PDF bajo sandbox y los consentimientos escaneados son PDFs.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  # ---- SPA ----
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Estos dos location tienen add_header propio: por eso repiten el snippet.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/veterp-security-headers.conf;
  }
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    include /etc/nginx/snippets/veterp-security-headers.conf;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
