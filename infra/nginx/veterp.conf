# =============================================================================
# nginx de producción — sirve el frontend y hace de reverse proxy del backend.
#
# Instalación:
#   sudo cp infra/nginx/veterp.conf /etc/nginx/sites-available/veterp
#   sudo ln -s /etc/nginx/sites-available/veterp /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: emitir con certbot --nginx -d vet.tudominio.com
# =============================================================================

server {
  listen 80;
  server_name vet.tudominio.com;

  # Redirección a HTTPS (deja esta línea comentada hasta emitir el certificado)
  # return 301 https://$host$request_uri;

  root /var/www/veterp;
  index index.html;

  client_max_body_size 50M;   # radiografías y resultados de laboratorio

  # ---- API ----
  location /api/ {
    proxy_pass         http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # ---- SPA ----
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # ---- Cabeceras de seguridad ----
  # OJO: add_header dentro de un `location` anula TODOS los del server. Si se
  # añade uno a /api/ o /assets/, hay que repetir estos ahí también.
  add_header X-Content-Type-Options nosniff            always;
  add_header X-Frame-Options DENY                      always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # La SPA carga sus tipografías de Google y habla con su propio /api. Todo lo
  # demás queda fuera: si un dato clínico se pega en un campo y alguien logra
  # inyectar un script, este no tiene a dónde mandarlo.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

  # Solo con el certificado ya emitido (descomentar junto al redirect de arriba):
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
