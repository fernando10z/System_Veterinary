# =============================================================================
# Cabeceras de seguridad del ERP. Se incluye en el server Y en cada location
# que tenga su propio add_header: en nginx, un add_header dentro de un
# location anula TODOS los heredados del server. Sin repetirlas aquí,
# index.html y /assets/ salían sin CSP ni X-Frame-Options.
#
#   sudo cp infra/nginx/snippets/veterp-security-headers.conf /etc/nginx/snippets/
# =============================================================================
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
# Solo se sirve por HTTPS (el server de :80 redirige): HSTS va siempre.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# La SPA carga sus tipografías de Google y habla con su propio origen: /api y
# /vet-docs (archivos clínicos servidos desde MinIO) están en el mismo dominio.
# Si STORAGE_PUBLIC_ENDPOINT apuntara a otro dominio, hay que añadirlo a
# img-src y connect-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
