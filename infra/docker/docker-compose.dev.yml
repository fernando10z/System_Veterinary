# =============================================================================
# docker-compose.dev.yml — Stack de desarrollo local (Postgres + Redis + MinIO).
#
# Uso:
#   cd infra/docker && docker compose -f docker-compose.dev.yml up -d
#
# Primer arranque (aplicar el schema):
#   bash db/scripts/apply-migrations.sh
#
# Reset total de la BD de dev:
#   ALLOW_RESET=yes bash db/scripts/reset-dev.sh
#
# Puertos remapeados para convivir con los stacks de System_ERP y Chatwoot:
#   - Postgres:       localhost:5435   postgres/postgres   db vet_demo
#   - Redis:          localhost:6382   (sin password en dev)
#   - MinIO API:      localhost:9102   admin/ChangeMe!2026
#   - MinIO Console:  localhost:9103   (misma credencial)
# =============================================================================

name: veterp

services:
  postgres:
    image: postgres:16-alpine
    container_name: veterp_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vet_demo
      TZ: America/Lima
      PGTZ: America/Lima
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vet_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: veterp_redis_dev
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6382:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: veterp_minio_dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: ChangeMe!2026
      MINIO_SERVER_URL: http://localhost:9102
    ports:
      - "9102:9000"
      - "9103:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: veterp_minio_init_dev
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 admin ChangeMe!2026 > /dev/null 2>&1; do
        echo '...esperando MinIO'; sleep 2;
      done &&
      mc mb --ignore-existing local/vet-docs &&
      echo 'Bucket vet-docs listo en MinIO.'
      "
    restart: "no"

volumes:
  postgres_data:
    name: veterp_postgres_data_dev
  redis_data:
    name: veterp_redis_data_dev
  minio_data:
    name: veterp_minio_data_dev
